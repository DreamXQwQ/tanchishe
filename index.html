<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="/tanchishe/style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        
        <div class="score-board">
            <div class="score-item">
                <span class="label">分数</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">最高分</span>
                <span id="high-score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">速度</span>
                <span id="speed" class="value">1</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="overlay" class="overlay">
                <div class="overlay-content">
                    <h2 id="overlay-title">准备开始</h2>
                    <p id="overlay-message">按 空格键 或 点击开始</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn primary">开始 / 重新开始</button>
            <button id="pauseBtn" class="btn">暂停 / 继续</button>
        </div>

        <div class="directions">
            <div class="row">
                <button class="dir-btn" data-dir="up">▲</button>
            </div>
            <div class="row">
                <button class="dir-btn" data-dir="left">◀</button>
                <button class="dir-btn" data-dir="down">▼</button>
                <button class="dir-btn" data-dir="right">▶</button>
            </div>
        </div>

        <div class="instructions">
            <p>⌨️ 方向键 / WASD 控制方向</p>
            <p>⌨️ 空格键 暂停/继续</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
